<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Skins de Jogos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding-top: 10px;
      padding-bottom: 30px;
    }

    .gto-section {
      max-width: 800px;
      margin: 0 auto;
    }

    .header-title {
      text-align: center;
      padding: 15px 15px 10px 15px;
    }

    h1 {
      color: #f39c12;
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    p.subtitulo {
      color: #aaaaaa;
      font-size: 0.9rem;
    }

    .card-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      margin: 15px auto 0 auto;
      padding: 0 15px;
    }

    @media (min-width: 600px) {
      .card-container {
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }
    }

    /* CARD TRANSFORMADO EM LINK CLICÁVEL */
    .card-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #2d2d2d;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:active {
      transform: scale(0.98);
      border-color: #e67e22;
    }

    .card img {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 12px 5px 5px 5px;
      text-align: left;
    }

    .card h3 {
      font-size: 1.1rem;
      color: #ffffff;
      margin-bottom: 5px;
    }

    .card p {
      font-size: 0.85rem;
      color: #bbbbbb;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <section class="gto-section">

    <div class="header-title">
      <h1>🚚 Galeria de Skins 🚗</h1>
      <p class="subtitulo">Toque no jogo para ver todas as skins!</p>
    </div>

    <main class="card-container">
      
      <!-- CARD INTEIRO CLICÁVEL -->
      <a href="global-truck.html" class="card-link">
        <div class="card">
          <img src="file_00000000b0b481f4a3aefd4e65ee3799.png" alt="Skins Global Truck Online">
          <div class="card-content">
            <h3>Skins Global Truck Online</h3>
            <p>Toque para ver a galeria completa de skins.</p>
          </div>
        </div>
      </a>

    </main>

  </section>

</body>
</html>
