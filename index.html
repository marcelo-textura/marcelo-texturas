<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Skins Global Truck Online</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding-top: 10px;
      padding-bottom: 30px;
    }

    .gto-section {
      max-width: 800px;
      margin: 0 auto;
    }

    .header-title {
      text-align: center;
      padding: 15px 15px 10px 15px;
    }

    h1 {
      color: #f39c12;
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    p.subtitulo {
      color: #aaaaaa;
      font-size: 0.9rem;
    }

    /* GALERIA DE CARDS */
    .card-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      margin: 15px auto 0 auto;
      padding: 0 15px;
    }

    @media (min-width: 600px) {
      .card-container {
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }
    }

    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #2d2d2d;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* IMAGEM PREENCHENDO A LARGURA TOTAL SEM BORDAS PRETAS */
    .card img {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1; /* Mantém a proporção quadrada perfeita da arte */
      border-radius: 8px;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 12px 5px 5px 5px;
      text-align: left;
    }

    .card h3 {
      font-size: 1.1rem;
      color: #ffffff;
      margin-bottom: 5px;
    }

    .card p {
      font-size: 0.85rem;
      color: #bbbbbb;
      margin-bottom: 15px;
      line-height: 1.3;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px 0;
      background: #e67e22;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
    }

    .btn:active {
      background: #d35400;
    }
  </style>
</head>
<body>

  <section class="gto-section">

    <div class="header-title">
      <h1>🚚 Skins Global Truck Online 🚗</h1>
      <p class="subtitulo">Baixe as melhores skins exclusivas para o seu jogo!</p>
    </div>

    <main class="card-container">
      
      <div class="card">
        <img src="file_00000000b0b481f4a3aefd4e65ee3799.png" alt="Skins Global Truck Online">
        <div class="card-content">
          <h3>Skins Global Truck Online</h3>
          <p>Skin detalhada e pronta para instalar no seu jogo.</p>
          <a href="#" class="btn">Baixar Skin</a>
        </div>
      </div>

    </main>

  </section>

</body>
</html>
