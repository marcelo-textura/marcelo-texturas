<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Skins de Caminhões e Carros</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding-bottom: 30px;
    }

    /* CAPA DO SITE NO TOPO */
    .banner-header {
      width: 100%;
      max-height: 250px;
      overflow: hidden;
      background-color: #1e1e1e;
      border-bottom: 2px solid #333;
    }

    .banner-header img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Garante que a imagem preencha a capa sem esticar */
      display: block;
    }

    .header-title {
      text-align: center;
      padding: 20px 15px 10px 15px;
    }

    h1 {
      color: #f39c12;
      font-size: 1.6rem;
      margin-bottom: 5px;
    }

    p.subtitulo {
      color: #aaaaaa;
      font-size: 0.95rem;
    }

    /* GALERIA DE CARDS */
    .card-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      max-width: 800px;
      margin: 20px auto 0 auto;
      padding: 0 15px;
    }

    @media (min-width: 600px) {
      .card-container {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }
    }

    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #2d2d2d;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card img {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      object-fit: cover;
      background-color: #2a2a2a;
    }

    .card-content {
      padding: 12px 5px 5px 5px;
      text-align: left;
    }

    .card h3 {
      font-size: 1.1rem;
      color: #ffffff;
      margin-bottom: 5px;
    }

    .card p {
      font-size: 0.85rem;
      color: #bbbbbb;
      margin-bottom: 15px;
      line-height: 1.3;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px 0;
      background: #e67e22;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
    }

    .btn:active {
      background: #d35400;
    }
  </style>
</head>
<body>

  <!-- BANNER DE CAPA -->
  <div class="banner-header">
    <img src="ChatGPT Image 23 de set. de 2026, 22_04_07.png" alt="Capa do Perfil">
  </div>

  <div class="header-title">
    <h1>🚚 Skins de Caminhões e Carros 🚗</h1>
    <p class="subtitulo">Baixe skins exclusivas para seus jogos favoritos!</p>
  </div>

  <main class="card-container">
    
    <!-- CARD DE SKIN 1 -->
    <div class="card">
      <img src="https://via.placeholder.com/600x337/333333/ffffff?text=Skins+Caminhao" alt="Skin Caminhão">
      <div class="card-content">
        <h3>Skin Caminhão Pintura Especial</h3>
        <p>Skin detalhada e pronta para instalar no seu jogo.</p>
        <a href="#" class="btn">Baixar Skin</a>
      </div>
    </div>

    <!-- CARD DE SKIN 2 -->
    <div class="card">
      <img src="https://via.placeholder.com/600x337/333333/ffffff?text=Skins+Carro" alt="Skin Carro">
      <div class="card-content">
        <h3>Skin Carro Esportivo</h3>
        <p>Visual esportivo personalizado em alta resolução.</p>
        <a href="#" class="btn">Baixar Skin</a>
      </div>
    </div>

  </main>

</body>
</html>
