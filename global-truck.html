<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Skins - Global Truck Online</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding-top: 15px;
      padding-bottom: 30px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    /* BOTÃO VOLTAR */
    .btn-voltar {
      display: inline-block;
      color: #f39c12;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 15px;
    }

    .header-title {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: #f39c12;
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    p.subtitulo {
      color: #aaaaaa;
      font-size: 0.9rem;
    }

    /* GALERIA DE CARDS */
    .card-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 600px) {
      .card-container {
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      }
    }

    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #2d2d2d;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* CARROSSEL ANIMADO */
    .carousel-wrapper {
      position: relative;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background-color: #181818;
    }

    .carousel-slides {
      display: flex;
      transition: transform 0.4s ease-in-out;
      width: 100%;
    }

    .carousel-slides img {
      width: 100%;
      flex-shrink: 0;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    /* CONTROLES DO CARROSSEL */
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      border: none;
      font-size: 1.2rem;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 50%;
      user-select: none;
      z-index: 2;
    }

    .carousel-btn.prev { left: 8px; }
    .carousel-btn.next { right: 8px; }

    .carousel-indicators {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 2;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      transition: background-color 0.3s;
    }

    .dot.active {
      background-color: #f39c12;
    }

    .card-content {
      padding: 12px 5px 5px 5px;
      text-align: left;
    }

    .card h3 {
      font-size: 1.1rem;
      color: #ffffff;
      margin-bottom: 5px;
    }

    .card p {
      font-size: 0.85rem;
      color: #bbbbbb;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    /* LINK VER MAIS AJUSTADO */
    .btn-ver-mais {
      display: inline-block;
      color: #f39c12;
      font-size: 0.85rem;
      font-weight: bold;
      text-decoration: none;
      margin-bottom: 15px;
    }

    .btn-ver-mais:hover {
      text-decoration: underline;
    }

    .btn-baixar {
      display: block;
      width: 100%;
      padding: 12px 0;
      background: #e67e22;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
    }

    .btn-baixar:active {
      background: #d35400;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <a href="index.html" class="btn-voltar">← Voltar para o início</a>

    <div class="header-title">
      <h1>🚚 Skins Global Truck Online</h1>
      <p class="subtitulo">Escolha e baixe sua skin favorita abaixo!</p>
    </div>

    <main class="card-container">
      
      <!-- CARD DA SKIN -->
      <div class="card">
        
        <div class="carousel-wrapper" id="carousel-1">
          <div class="carousel-slides">
            <img src="file_00000000b0b481f4a3aefd4e65ee3799.png" alt="Imagem 1">
            <img src="file_00000000b0b481f4a3aefd4e65ee3799.png" alt="Imagem 2">
          </div>
          
          <button class="carousel-btn prev" onclick="moveSlide('carousel-1', -1)">&#10094;</button>
          <button class="carousel-btn next" onclick="moveSlide('carousel-1', 1)">&#10095;</button>
          
          <div class="carousel-indicators">
            <span class="dot active"></span>
            <span class="dot"></span>
          </div>
        </div>

        <div class="card-content">
          <h3>Skin Guarda Municipal Aguaí</h3>
          <p>Pintura detalhada da Guarda Municipal de Aguaí em alta resolução para caminhonete no Global Truck Online.</p>
          
          <!-- BOTÃO PEQUENO VER MAIS -->
          <a href="skin-guarda-municipal.html" class="btn-ver-mais">Ver mais →</a>
          
          <a href="#" class="btn-baixar">Baixar Skin</a>
        </div>
      </div>

    </main>

  </div>

  <script>
    const carouselStates = {};

    function moveSlide(carouselId, direction) {
      const carousel = document.getElementById(carouselId);
      const slidesContainer = carousel.querySelector('.carousel-slides');
      const totalSlides = slidesContainer.children.length;
      const dots = carousel.querySelectorAll('.dot');

      if (!(carouselId in carouselStates)) {
        carouselStates[carouselId] = 0;
      }

      carouselStates[carouselId] = (carouselStates[carouselId] + direction + totalSlides) % totalSlides;
      const currentIndex = carouselStates[carouselId];

      slidesContainer.style.transform = `translateX(-${currentIndex * 100}%)`;

      dots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx === currentIndex);
      });
    }
  </script>

</body>
</html>
